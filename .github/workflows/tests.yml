# Runs every test suite headless (tests/run_all.tscn via tools/test.sh) on each push.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-4.7.2-stable-win64

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip
          mkdir -p ~/godot && unzip -q godot.zip -d ~/godot && rm godot.zip

      - name: Run tests
        shell: bash
        run: |
          export GODOT_BIN="$HOME/godot/Godot_v4.7.2-stable_win64_console.exe"
          tools/test.sh
